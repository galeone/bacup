on: [push, pull_request]

name: Quick checks

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17

      - name: Run cargo check
        uses: clechasseur/rs-cargo@v5.0.6
        with:
          command: check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17

      - name: Run cargo test
        uses: clechasseur/rs-cargo@v5.0.6
        with:
          command: test

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17

      - name: Run cargo fmt
        uses: clechasseur/rs-cargo@v5.0.6
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: clechasseur/rs-cargo@v5.0.6
        with:
          command: clippy
          args: -- -D warnings