[package]
name = "bacup"
version = "0.2.0"
description = "An easy-to-use backup tool designed for servers."
readme = "README.md"
authors = ["Paolo Galeone <me@pgaleone.eu>"]
edition = "2018"
repository = "https://github.com/galeone/bacup"
default-run = "bacup"
license = "Apache-2.0"
keywords = ["backup", "ssh", "server", "easy-to-use"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
dyn-clone = "1.0.20"
futures = "0.3.34"
glob = "0.3.4"
log = "0.4.34"
regex = "1.13.1"
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
shellexpand = "3.1.2"
stderrlog = "0.6.0"
structopt = "0.3.26"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
url = { version = "2.5.8", features = ["serde"] }
which = "8.0.6"
base64 = "0.22.1"
aws-config = "1.12.0"
aws-credential-types = { version = "1.3.0", features = ["hardcoded-credentials"] }
aws-sdk-s3 = "1.152.0"
async-compression = { version = "0.4.50", default-features = false, features = ["tokio", "gzip"] }
tokio-cron-scheduler = "0.15.1"
cron = "0.17.0"
uuid = { version = "1.27.0", features = ["v4"] }
aws-types = "1.6.0"
croner = "4.0.1"
astral-tokio-tar = "0.7.0"
get-file-size = "0.1.2"
sysinfo = "0.39.6"
